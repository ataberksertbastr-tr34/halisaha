<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halı Saha Organizatörü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EB; --surface:#FFFFFF; --surface-2:#F5F8F3; --ink:#13201A; --muted:#566A5D; --line:#D3DCD4;
  --turf:#1E6A42; --turf-2:#185A37; --chalk:#FFFFFF;
  --bibA:#E2F01C; --bibB:#FF6A1A;
  --ok:#17834A; --warn:#B07800; --bad:#C2352B; --focus:#0E7AD8;
  --font:"Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1812; --surface:#13241A; --surface-2:#182C20; --ink:#E7EFE9; --muted:#93A89A; --line:#27402F;
    --turf:#18563A; --turf-2:#134630; --ok:#3DBE77; --warn:#E3AE2B; --bad:#F06A5E; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1812; --surface:#13241A; --surface-2:#182C20; --ink:#E7EFE9; --muted:#93A89A; --line:#27402F;
  --turf:#18563A; --turf-2:#134630; --ok:#3DBE77; --warn:#E3AE2B; --bad:#F06A5E; color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
[hidden]{ display:none !important; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
img,svg{ max-width:100%; }

/* hero */
#hero{ background:var(--turf); color:var(--chalk); position:relative; overflow:hidden; }
#hero::before{ content:""; position:absolute; inset:0; background:repeating-linear-gradient(90deg, transparent 0 56px, rgba(255,255,255,.045) 56px 112px); pointer-events:none; }
#hero::after{ content:""; position:absolute; right:-70px; bottom:-90px; width:220px; height:220px; border:3px solid rgba(255,255,255,.55); border-radius:50%; pointer-events:none; }
.hero-in{ position:relative; max-width:760px; margin:0 auto; padding:16px 18px 18px; }
.brand{ display:flex; justify-content:space-between; align-items:center; gap:12px; font-weight:600; font-size:14px; opacity:.92; }
.sync{ font-size:12px; padding:3px 9px; border-radius:20px; background:rgba(0,0,0,.22); white-space:nowrap; }
.hero-main{ display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-top:10px; }
.hero-day{ font-family:var(--display); font-weight:800; font-size:clamp(32px,9vw,50px); line-height:.95; }
.hero-sub{ margin-top:6px; font-size:15px; opacity:.92; }
.hero-count{ text-align:right; font-family:var(--display); font-weight:700; line-height:1; flex:0 0 auto; }
.hero-count b{ display:block; font-size:clamp(38px,11vw,58px); font-weight:800; font-variant-numeric:tabular-nums; }
.hero-count span{ font-family:var(--font); font-size:13px; font-weight:500; opacity:.85; }
.hero-empty{ font-family:var(--display); font-weight:700; font-size:30px; margin-top:12px; }

/* layout */
main{ max-width:760px; margin:0 auto; padding:14px 14px 110px; }
.section{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
h2{ font-family:var(--display); font-weight:700; font-size:24px; margin:0 0 10px; line-height:1.1; }
h3{ font-size:15px; font-weight:700; margin:16px 0 8px; }
.muted{ color:var(--muted); }
.small{ font-size:13px; }
.row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.grow{ flex:1 1 auto; min-width:0; }
.grid2{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; }
.grid2.stack{ grid-template-columns:1fr 1fr; }
@media (max-width:520px){ .grid2.stack{ grid-template-columns:1fr; } }
.full{ grid-column:1 / -1; }
label.fld{ display:block; font-size:13px; color:var(--muted); font-weight:600; min-width:0; }
label.fld input, label.fld select, label.fld textarea{ margin-top:4px; }
input[type=text],input[type=search],input[type=tel],input[type=url],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:10px; background:var(--surface-2); min-height:44px; color:var(--ink);
}
input[type=search]::-webkit-search-cancel-button{ -webkit-appearance:none; }
textarea{ min-height:120px; resize:vertical; line-height:1.4; }

/* buttons */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:44px; padding:0 16px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-weight:600; text-decoration:none; color:var(--ink); }
.btn.primary{ background:var(--turf); color:#fff; border-color:var(--turf); }
.btn.bibA{ background:var(--bibA); color:#13201A; border-color:transparent; }
.btn.bibB{ background:var(--bibB); color:#13201A; border-color:transparent; }
.btn.ghost{ background:transparent; }
.btn.danger{ color:var(--bad); }
.btn.armed{ background:var(--bad); color:#fff; border-color:var(--bad); }
.btn.sm{ min-height:36px; padding:0 12px; font-size:14px; }
.btn.xs{ white-space:nowrap; min-height:30px; padding:0 9px; font-size:13px; border-radius:8px; }
.btn.block{ width:100%; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.linkbtn{ border:none; background:none; padding:4px 0; font-size:13px; font-weight:600; color:var(--turf); text-decoration:underline; text-underline-offset:2px; }
:root[data-theme="dark"] .linkbtn{ color:var(--bibA); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .linkbtn{ color:var(--bibA); } }

/* chips */
.chips{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px; scrollbar-width:none; }
.chip{ flex:0 0 auto; min-height:40px; padding:0 14px; border-radius:20px; border:1px solid var(--line); background:var(--surface); font-weight:600; font-size:14px; }
.chip.on{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.filters{ display:flex; gap:6px; overflow-x:auto; margin:8px 0 2px; padding-bottom:2px; scrollbar-width:none; }
.fchip{ flex:0 0 auto; min-height:34px; padding:0 12px; border-radius:17px; border:1px solid var(--line); background:var(--surface); font-size:13px; font-weight:600; color:var(--muted); }
.fchip.on{ background:var(--turf); color:#fff; border-color:var(--turf); }
.finder{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--surface); margin:0 -14px; padding:2px 14px 6px; border-bottom:1px solid transparent; }
.search{ position:relative; margin-top:10px; }
.search svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--muted); pointer-events:none; }
.search input{ padding-left:38px; padding-right:44px; }
.search .clr{ position:absolute; right:4px; top:50%; transform:translateY(-50%); border:none; background:transparent; width:38px; height:38px; border-radius:8px; color:var(--muted); font-weight:700; }

/* counters */
.counts{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:0 0 12px; }
.count{ background:var(--surface-2); border-radius:10px; padding:8px 6px; text-align:center; min-width:0; }
.count b{ display:block; font-family:var(--display); font-size:26px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; white-space:nowrap; }
.count span{ font-size:12px; color:var(--muted); font-weight:600; }

/* field card */
.fieldcard{ background:var(--surface-2); border-radius:12px; padding:12px; margin-top:10px; }
.fieldcard strong{ display:block; font-size:16px; }
.fieldcard .addr{ font-size:14px; color:var(--muted); margin:2px 0 10px; }
.fieldcard .row .btn{ flex:1 1 auto; }

/* player rows */
.plist{ list-style:none; margin:10px 0 0; padding:0; }
.prow{ display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
.plist .prow:first-child{ border-top:none; }
.pmain{ display:flex; align-items:center; gap:8px; width:100%; }
.pname{ flex:1 1 auto; min-width:0; }
.pname strong{ display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pname .meta{ display:block; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.prow.passive strong{ color:var(--muted); }
.num{ font-family:var(--display); font-weight:700; color:var(--muted); width:22px; text-align:right; flex:0 0 auto; font-variant-numeric:tabular-nums; }
.pips{ letter-spacing:1px; font-size:10px; color:var(--muted); }
.tag{ display:inline-block; font-size:11px; font-weight:700; padding:1px 6px; border-radius:6px; background:var(--surface-2); border:1px solid var(--line); margin-left:4px; vertical-align:1px; color:var(--ink); }
.tag.wait{ color:var(--warn); border-color:currentColor; background:transparent; }
.tag.debt{ color:var(--bad); border-color:currentColor; background:transparent; }
.pos{ display:inline-block; font-size:11px; font-weight:700; padding:1px 6px; border-radius:6px; margin-left:4px; vertical-align:1px; color:#13201A; }
.pos-GK{ background:#FFE07A; } .pos-DEF{ background:#BFD8FF; } .pos-MID{ background:#C9EDC9; } .pos-FWD{ background:#FFC8B3; }
.seg{ display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; flex:0 0 auto; }
.seg button{ border:none; background:var(--surface); min-width:40px; min-height:40px; padding:0 6px; font-size:14px; font-weight:700; color:var(--muted); border-left:1px solid var(--line); }
.seg button:first-child{ border-left:none; }
.seg button.on-in{ background:var(--ok); color:#fff; }
.seg button.on-maybe{ background:var(--warn); color:#fff; }
.seg button.on-out{ background:var(--muted); color:var(--surface); }
.seg button.on-late{ background:var(--bad); color:#fff; }
.seg.rate button{ min-width:38px; }
.seg.rate button.on{ background:var(--turf); color:#fff; }
.toggle{ min-height:36px; padding:0 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface); font-size:13px; font-weight:700; color:var(--muted); }
.toggle.on{ background:var(--turf); color:#fff; border-color:var(--turf); }
.editor{ width:100%; margin-top:6px; padding:12px; background:var(--surface-2); border-radius:12px; display:grid; gap:10px; }
.editor input, .editor select{ background:var(--surface); }
.none-msg{ text-align:center; color:var(--muted); padding:16px 0 6px; margin:0; }
.legend{ margin:8px 0 0; font-size:13px; color:var(--muted); }

/* teams */
.pitch-wrap{ max-width:420px; margin:0 auto 12px; }
.teams{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; }
.team{ border-radius:12px; padding:10px; border:1px solid var(--line); background:var(--surface); min-width:0; }
.team-head{ padding:6px 10px; border-radius:8px; margin:-4px -4px 6px; color:#13201A; }
.team-head b{ display:block; font-family:var(--display); font-size:21px; font-weight:800; line-height:1.1; }
.team-head span{ display:block; font-size:12px; font-weight:600; }
.team.a .team-head{ background:var(--bibA); }
.team.b .team-head{ background:var(--bibB); }
.tprow{ display:flex; align-items:center; gap:2px; }
.tp{ display:flex; flex:1 1 auto; min-width:0; justify-content:space-between; align-items:center; gap:6px; min-height:40px; padding:4px 6px; border:none; background:transparent; border-radius:8px; text-align:left; }
.tp:hover{ background:var(--surface-2); }
.tp .nm{ min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
.tp .sw{ font-size:12px; color:var(--muted); flex:0 0 auto; }
.tx{ flex:0 0 auto; width:26px; height:34px; border:none; background:transparent; color:var(--muted); border-radius:8px; font-weight:700; }
.tx:hover{ background:var(--surface-2); color:var(--bad); }
.diff{ text-align:center; font-weight:600; margin:10px 0 0; }

/* payments */
.payrow{ display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line); }
.payrow:first-of-type{ border-top:none; }
.paybtn{ min-height:40px; min-width:100px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-weight:700; font-size:14px; flex:0 0 auto; }
.paybtn.paid{ background:var(--ok); color:#fff; border-color:var(--ok); }
.amount{ font-family:var(--display); font-weight:700; font-size:20px; font-variant-numeric:tabular-nums; flex:0 0 auto; }
.money-sum{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0; }
.money-sum .count b{ font-size:21px; }
.iban{ display:flex; align-items:center; gap:8px; background:var(--surface-2); border-radius:10px; padding:8px 10px; margin-bottom:10px; font-size:14px; }
.iban code{ font-family:inherit; font-weight:600; flex:1 1 auto; min-width:0; overflow-wrap:anywhere; }
.sublinks{ display:flex; gap:12px; flex-wrap:wrap; }

/* nav */
#tabs{ position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); z-index:20; }
.tabs-in{ max-width:760px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); }
.tab{ border:none; background:transparent; min-height:58px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:12px; font-weight:600; color:var(--muted); }
.tab svg{ width:22px; height:22px; }
.tab.on{ color:var(--turf); }
:root[data-theme="dark"] .tab.on{ color:var(--bibA); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tab.on{ color:var(--bibA); } }

/* modal & toast */
#modal{ position:fixed; inset:0; background:rgba(5,15,10,.55); z-index:40; display:flex; align-items:flex-end; justify-content:center; }
.sheet{ background:var(--surface); width:100%; max-width:560px; border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px)); max-height:90vh; overflow:auto; }
@media (min-width:600px){ #modal{ align-items:center; } .sheet{ border-radius:18px; } }
.sheet textarea{ min-height:260px; font-size:14px; }
.sheet .stackf{ display:grid; gap:10px; }
#toast{ position:fixed; left:50%; bottom:84px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50; max-width:90vw; text-align:center; }
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce){ #toast{ transition:none; } }
.empty{ text-align:center; padding:26px 10px; }
.empty p{ margin:0 0 12px; color:var(--muted); }
details summary{ cursor:pointer; font-weight:600; min-height:36px; display:flex; align-items:center; }
.hist{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 0; border-top:1px solid var(--line); }
.hist:first-of-type{ border-top:none; }
.score{ font-family:var(--display); font-weight:800; font-size:22px; font-variant-numeric:tabular-nums; }
.scorebox{ display:flex; align-items:center; gap:10px; justify-content:center; margin:6px 0 10px; }
.scorebox input{ width:72px; text-align:center; font-family:var(--display); font-size:28px; font-weight:800; }
.scorebox .sw{ width:16px; height:16px; border-radius:4px; display:inline-block; }
.flist .frow{ display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
.flist .frow:first-child{ border-top:none; }
</style>
</head>

<main id="view"></main>
<nav id="tabs"></nav>
<div id="modal" hidden></div>

const KEY = "halisaha.v1";
function defaults(){
  return { v:2, updatedAt:0,
    settings:{ defaultFieldId:"", price:3000, iban:"", ibanName:"", slots:[{d:2,t:"21:00"},{d:4,t:"21:00"}], format:7, gkFree:true, round:true, lang:"tr" },
    fields:[], players:[], matches:[] };
}
function migrate(s){
  const d = defaults();
  if(!s || typeof s!=="object") return d;
  const old = s.settings || {};
  s.settings = Object.assign(d.settings, old);
  if(!Array.isArray(s.settings.slots)) s.settings.slots = d.settings.slots;
  s.fields = Array.isArray(s.fields)? s.fields : [];
  if(typeof s.settings.field==="string"){
    if(s.settings.field.trim() && !s.fields.some(f=>f.name===s.settings.field.trim())){
      const f = { id:uid(), name:s.settings.field.trim(), address:"", link:"", phone:"", price:Number(s.settings.price)||0, lat:null, lng:null };
      s.fields.push(f); if(!s.settings.defaultFieldId) s.settings.defaultFieldId = f.id;
    }
    delete s.settings.field;
  }
  s.players = Array.isArray(s.players)? s.players : [];
  s.players.forEach(p=>{ if(!p.pos) p.pos = p.gk? "GK" : ""; delete p.gk; if(p.phone==null) p.phone=""; });
  s.matches = Array.isArray(s.matches)? s.matches : [];
  s.matches.forEach(m=>{
    m.att=m.att||{}; m.order=m.order||[]; m.guests=m.guests||[]; m.paid=m.paid||{}; m.exempt=m.exempt||{}; m.teams=m.teams||{a:[],b:[]};
    m.guests.forEach(g=>{ if(!g.pos) g.pos = g.gk? "GK":""; delete g.gk; });
    if(!m.fieldId && m.field){ const f = s.fields.find(x=>x.name===m.field); if(f) m.fieldId=f.id; }
  });
  s.v = 2; s.updatedAt = s.updatedAt||0;
  return s;
}
function loadLocal(){ try{ const raw = localStorage.getItem(KEY); return migrate(raw? JSON.parse(raw): null); }catch(e){ return defaults(); } }
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3); }
let S = loadLocal();

/* ---------- cloud sync (db capability, private per user) ---------- */
let dbRef = null, syncMode = "local", writing = false, again = false, timer = null;
async function initCloud(){
  if(!window.claude || typeof window.claude.use!=="function") return;
  try{
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!db || !user) return;
    const id = await user.id();
    if(!id) return;
    dbRef = db.doc("data/users/"+id+"/state");
    dbRef.onSnapshot(snap=>{
      if(snap.metadata && snap.metadata.hasPendingWrites) return;
      if(!snap.exists){ syncMode="cloud"; if(S.updatedAt) pushCloud(); renderSync(); return; }
      const d = snap.data();
      if(d && d.state && (d.updatedAt||0) > (S.updatedAt||0)){
        S = migrate(JSON.parse(JSON.stringify(d.state))); S.updatedAt = d.updatedAt; saveLocal(); render();
      }
      syncMode="cloud"; renderSync();
    }, ()=>{ syncMode="local"; renderSync(); });
  }catch(e){ dbRef=null; }
}
async function pushCloud(){
  if(!dbRef) return;
  if(writing){ again=true; return; }
  writing = true;
  try{ await dbRef.set({ state: JSON.parse(JSON.stringify(S)), updatedAt: S.updatedAt }); syncMode="cloud"; }
  catch(e){ if(e && (e.code==="invalid_argument"||e.code==="revoked"||e.code==="not_granted")) dbRef=null; syncMode="local"; }
  writing = false;
  if(again){ again=false; pushCloud(); }
  renderSync();
}
function commit(noRender){
  S.updatedAt = Date.now(); saveLocal();
  clearTimeout(timer); timer = setTimeout(pushCloud, 700);
  if(!noRender) render();
}

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
const esc = s=> String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function t(k, vars){ let s=(L[S.settings.lang]||L.tr)[k]; if(s==null) s=L.tr[k]; if(s==null) s=k; if(vars) for(const v in vars) s=s.split("{"+v+"}").join(vars[v]); return s; }
function money(n){ return new Intl.NumberFormat("tr-TR",{maximumFractionDigits:2}).format(Math.round(n*100)/100)+" ₺"; }
function iso(d){ const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function parseISO(s){ const [y,m,d]=String(s).split("-").map(Number); return new Date(y,(m||1)-1,d||1); }
const todayISO = ()=> iso(new Date());
function dayName(s){ return DAYS[S.settings.lang==="en"?"en":"tr"][parseISO(s).getDay()]; }
function ddmm(s){ const d=parseISO(s); return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0"); }
function pips(r){ r=Math.max(1,Math.min(5,r||3)); return "●".repeat(r)+"○".repeat(5-r); }
function trSort(a,b){ return a.name.localeCompare(b.name, "tr"); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function norm(s){ return String(s||"").toLocaleLowerCase("tr").replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c").replace(/[âà]/g,"a").replace(/î/g,"i").replace(/û/g,"u").trim(); }
function posBadge(p){ return p && p.pos ? '<span class="pos pos-'+p.pos+'" title="'+esc(t("pos"+p.pos))+'">'+esc(t("s"+p.pos))+'</span>' : ''; }
const isGK = p => !!(p && p.pos==="GK");
function safeUrl(u){ u=String(u||"").trim(); return /^https?:\/\//i.test(u)? u : ""; }
function phoneDigits(ph){ let d=String(ph||"").replace(/\D/g,""); if(!d) return ""; if(d.startsWith("00")) d=d.slice(2); if(d.length===11 && d[0]==="0") d="9"+d; if(d.length===10 && d[0]==="5") d="90"+d; return d; }

function nextSlot(afterISO){
  const slots = S.settings.slots.filter(s=>s && s.d!=="" && s.d!=null);
  const start = parseISO(afterISO);
  for(let i=1;i<=14;i++){
    const d = new Date(start); d.setDate(d.getDate()+i);
    const hit = slots.find(s=>Number(s.d)===d.getDay());
    if(hit) return { date: iso(d), time: hit.t||"21:00" };
  }
  const d = new Date(start); d.setDate(d.getDate()+1);
  return { date: iso(d), time: "21:00" };
}
function getMatch(id){ return S.matches.find(m=>m.id===id)||null; }
function currentMatch(){
  const m = ui.matchId && getMatch(ui.matchId);
  if(m && m.status==="open") return m;
  const open = S.matches.filter(x=>x.status==="open").sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const today = todayISO();
  return open.find(x=>x.date>=today) || open[open.length-1] || null;
}
function getField(id){ return S.fields.find(f=>f.id===id)||null; }
function fieldOf(m){ return getField(m.fieldId) || (m.field? {name:m.field}: null); }
function mapsUrl(f){
  if(!f) return "";
  const l = safeUrl(f.link); if(l) return l;
  if(f.lat!=null && f.lng!=null && f.lat!=="") return "https://www.google.com/maps/search/?api=1&query="+f.lat+","+f.lng;
  const q = [f.name, f.address].filter(Boolean).join(", ");
  return q? "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q) : "";
}
function dirUrl(f){
  if(!f) return "";
  if(f.lat!=null && f.lng!=null && f.lat!=="") return "https://www.google.com/maps/dir/?api=1&destination="+f.lat+","+f.lng;
  const l = safeUrl(f.link); if(l) return l;
  const q = [f.name, f.address].filter(Boolean).join(", ");
  return q? "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(q) : "";
}
function getP(m, id){ return S.players.find(p=>p.id===id) || (m && m.guests.find(g=>g.id===id)) || null; }
const isGuest = (id)=> !S.players.some(p=>p.id===id);
const capOf = m => ((m.format||S.settings.format)+1)*2;
function lineup(m){
  const ins = m.order.filter(id=>m.att[id]==="in" && getP(m,id));
  const c = capOf(m);
  return { playing: ins.slice(0,c), wait: ins.slice(c) };
}
function isFree(m,id){ return !!(S.settings.gkFree && isGK(getP(m,id))); }
function payersOf(m){
  if(m.status==="cancelled") return [];
  const { playing } = lineup(m);
  const late = Object.keys(m.att).filter(id=>m.att[id]==="late" && getP(m,id));
  return playing.concat(late).filter(id=>!isFree(m,id) && !m.exempt[id]);
}
function roundShare(raw){ return S.settings.round ? Math.ceil(raw/5)*5 : Math.round(raw*100)/100; }
function shareOf(m){ const n = payersOf(m).length; return n? roundShare((Number(m.price)||0)/n) : 0; }
function estShare(m){
  const n = payersOf(m).length;
  if(n) return shareOf(m);
  const c = capOf(m) - (S.settings.gkFree?2:0);
  return roundShare((Number(m.price)||0)/Math.max(1,c));
}
function isDue(m){ return m.status==="played" || (m.status==="open" && m.date<=todayISO()); }
function debts(){
  const map = {};
  S.matches.forEach(m=>{
    if(m.status==="cancelled" || !isDue(m)) return;
    const sh = shareOf(m);
    payersOf(m).forEach(id=>{
      if(m.paid[id]) return;
      const p = getP(m,id); if(!p) return;
      map[id] = map[id] || { id, name:p.name, total:0, n:0, phone:p.phone||"" };
      map[id].total += sh; map[id].n++;
    });
  });
  return Object.values(map).sort((a,b)=>b.total-a.total);
}
function debtMap(){ const d={}; debts().forEach(x=>d[x.id]=x.total); return d; }
function computeStats(){
  const st = {};
  S.matches.forEach(m=>{
    if(m.status!=="played") return;
    lineup(m).playing.forEach(id=>{ st[id]=st[id]||{p:0,w:0,d:0,l:0}; st[id].p++; });
    if(!m.score || !(m.teams.a.length||m.teams.b.length)) return;
    const r = m.score.a>m.score.b? "a" : m.score.a<m.score.b? "b" : "d";
    ["a","b"].forEach(side=> m.teams[side].forEach(id=>{ const s=st[id]; if(!s) return; if(r==="d") s.d++; else if(r===side) s.w++; else s.l++; }));
  });
  return st;
}
function teamSum(m, ids){ return ids.reduce((s,id)=>s+((getP(m,id)||{}).rating||3),0); }
function posCounts(m, ids){ const c={}; ids.forEach(id=>{ const p=getP(m,id); const k=(p&&p.pos)||""; if(k) c[k]=(c[k]||0)+1; }); return POS.filter(k=>c[k]).map(k=>c[k]+" "+t("s"+k)).join(", "); }

/* ---------- team generator (strength + position balance) ---------- */
function generateTeams(m){
  const ids = lineup(m).playing;
  const ps = ids.map(id=>{ const p=getP(m,id)||{}; return { id, r:p.rating||3, pos:p.pos||"" }; });
  const gks = ps.filter(p=>p.pos==="GK"), fld = ps.filter(p=>p.pos!=="GK");
  const sizeA = Math.ceil(ps.length/2), sizeB = ps.length - sizeA;
  let best = [], bestScore = Infinity;
  for(let it=0; it<600; it++){
    const A=[], B=[]; let sa=0, sb=0; const ca={}, cb={};
    const put=(p,toA)=>{ if(toA){A.push(p.id); sa+=p.r; ca[p.pos]=(ca[p.pos]||0)+1;} else {B.push(p.id); sb+=p.r; cb[p.pos]=(cb[p.pos]||0)+1;} };
    shuffle(gks.slice()).forEach((p,j)=> put(p, j%2===0 ? A.length<sizeA : B.length>=sizeB));
    const order = fld.map(p=>({p, k:p.r + Math.random()*1.2})).sort((x,y)=>y.k-x.k).map(o=>o.p);
    order.forEach(p=>{
      if(A.length>=sizeA) return put(p,false);
      if(B.length>=sizeB) return put(p,true);
      const pa=ca[p.pos]||0, pb=cb[p.pos]||0;
      if(p.pos && pa!==pb && Math.random()<.6) return put(p, pa<pb);
      put(p, sa===sb ? Math.random()<.5 : sa<sb);
    });
    let pen = 0; ["DEF","MID","FWD"].forEach(k=>{ pen += Math.abs((ca[k]||0)-(cb[k]||0)); });
    const score = Math.abs(sa-sb)*2 + pen;
    if(score < bestScore - 1e-9){ bestScore = score; best = [{A,B}]; }
    else if(Math.abs(score-bestScore)<1e-9 && best.length<40) best.push({A,B});
  }
  const pick = best[Math.floor(Math.random()*best.length)];
  m.teams = { a: pick.A, b: pick.B }; m.manualTeams = false;
}
function cleanTeams(m){
  const set = new Set(lineup(m).playing);
  m.teams.a = m.teams.a.filter(id=>set.has(id));
  m.teams.b = m.teams.b.filter(id=>set.has(id));
  const placed = new Set(m.teams.a.concat(m.teams.b));
  return lineup(m).playing.filter(id=>!placed.has(id));
}

  const f = fieldOf(m);
  let s = "⚽ "+dayName(m.date)+" "+ddmm(m.date)+" – "+m.time+"\n";
  if(f){ s += "📍 "+f.name+(f.address? ", "+f.address:"")+"\n"; const u=mapsUrl(f); if(u) s += "🗺️ "+u+"\n"; }
  return s;
}
function msgInvite(m){
  const { playing, wait } = lineup(m);
  const maybe = Object.keys(m.att).filter(id=>m.att[id]==="maybe" && getP(m,id));
  const c = capOf(m);
  let s = headerLines(m);
  s += "👥 "+(m.format||S.settings.format)+"+1 ("+playing.length+"/"+c+")\n";
  s += "💰 "+t("perPerson")+" ~"+money(estShare(m))+"\n\n";
  for(let i=0;i<c;i++){ const id=playing[i]; s += (i+1)+". "+(id? getP(m,id).name+(isGK(getP(m,id))?" 🧤":"") : "")+"\n"; }
  if(wait.length) s += "\n⏳ "+t("waitlist")+": "+wait.map(id=>getP(m,id).name).join(", ")+"\n";
  if(maybe.length) s += "🤔 "+t("maybe")+": "+maybe.map(id=>getP(m,id).name).join(", ")+"\n";
  return s + "\n"+t("inviteFooter");
}
function msgTeams(m){
  cleanTeams(m);
  const line = ids=> ids.map(id=>"• "+getP(m,id).name+(isGK(getP(m,id))?" 🧤":"")).join("\n");
  return headerLines(m)+"\n🟡 "+t("teamA")+"\n"+line(m.teams.a)+"\n\n🟠 "+t("teamB")+"\n"+line(m.teams.b)+"\n\n"+t("teamsFooter");
}
function ibanLine(){ return S.settings.iban? "IBAN: "+S.settings.iban+(S.settings.ibanName? " ("+S.settings.ibanName+")":"") : ""; }
function msgPay(m){
  const sh = shareOf(m);
  const unpaid = payersOf(m).filter(id=>!m.paid[id]);
  let s = "💸 "+t("payHeader")+" – "+dayName(m.date)+" "+ddmm(m.date)+"\n"+t("perPerson")+": "+money(sh)+"\n";
  if(S.settings.iban) s += "\n"+ibanLine()+"\n";
  if(unpaid.length) s += "\n"+t("stillUnpaid")+":\n"+unpaid.map(id=>"• "+getP(m,id).name).join("\n")+"\n\n"+t("payFooter");
  else s += "\n"+t("everyonePaid");
  return s;
}
function waPersonal(phone, name, amt){
  const d = phoneDigits(phone); if(!d) return "";
  const text = t("personalPay",{name, amt:money(amt), iban: S.settings.iban? " "+ibanLine()+".":""});
  return "https://wa.me/"+d+"?text="+encodeURIComponent(text);

/* ---------- search & filter ---------- */
function fchip(key, type, v, label){ const on=(ui.f[key][type]||"")===v; return '<button class="fchip'+(on?' on':'')+'" data-a="flt" data-k="'+key+'" data-t="'+type+'" data-v="'+v+'" aria-pressed="'+on+'">'+esc(label)+'</button>'; }
function filterBar(key, withStatus){
  const f = ui.f[key];
  let h = '<div class="finder"><div class="search">'+IC.search+'<input type="search" id="q-'+key+'" data-q="'+key+'" placeholder="'+esc(t("search"))+'" value="'+esc(f.q)+'" autocomplete="off" enterkeyhint="search" aria-label="'+esc(t("search"))+'"><button class="clr" data-a="clearQ" data-k="'+key+'" aria-label="✕"'+(f.q?'':' hidden')+'>✕</button></div>';
  if(withStatus) h += '<div class="filters">'+[["","all"],["in","statusIn"],["maybe","maybe"],["none","statusNone"],["out","statusOut"]].map(([v,l])=>fchip(key,"st",v,t(l))).join("")+'</div>';
  h += '<div class="filters">'+fchip(key,"pos","",t("allPos"))+POS.map(p=>fchip(key,"pos",p,t("pos"+p))).join("")+'</div></div>';
  return h;
}
function applyFilter(key){
  const box = document.getElementById("list-"+key); if(!box) return;
  const f = ui.f[key], q = norm(f.q); let shown = 0;
  box.querySelectorAll("[data-n]").forEach(r=>{
    const ok = (!q || r.dataset.n.indexOf(q)>=0) && (!f.pos || r.dataset.p===f.pos) && (!f.st || r.dataset.s===f.st);
    r.hidden = !ok; if(ok) shown++;
  });
  const none = document.getElementById("none-"+key); if(none) none.hidden = shown>0;
  document.querySelectorAll('[data-a="flt"][data-k="'+key+'"]').forEach(c=>{ const on=(f[c.dataset.t]||"")===c.dataset.v; c.classList.toggle("on",on); c.setAttribute("aria-pressed",on); });
  const clr = document.querySelector('[data-a="clearQ"][data-k="'+key+'"]'); if(clr) clr.hidden = !f.q;
}

      (g?' <span class="tag">'+esc(t("guest"))+'</span>':'')+(w>=0?' <span class="tag wait">'+esc(t("waitlist"))+' '+(w+1)+'</span>':'')+(dm[p.id]?' <span class="tag debt">'+esc(t("debtTag"))+'</span>':'')+'</span></div>'+

  return h + historyBlock();
}
function historyBlock(){
  const past = S.matches.filter(m=>m.status!=="open").sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));

    let sub = '';
    if(m.status==="played" && m.score) sub = m.score.a!==m.score.b ? t("dessert",{t: m.score.a<m.score.b? t("teamA"):t("teamB")}) : t("draw");

    h += '<div class="hist"><div style="min-width:0"><strong>'+esc(dayName(m.date))+' '+esc(ddmm(m.date))+'</strong> <span class="muted small">'+esc(m.time)+(f? ', '+esc(f.name):'')+'</span>'+(sub?'<div class="small muted">'+esc(sub)+'</div>':'')+'</div><div class="row" style="flex-wrap:nowrap">'+res+'<button class="btn xs ghost" data-a="reopen" data-id="'+m.id+'">'+esc(t("reopen"))+'</button></div></div>';

}

/* --- teams tab --- */
function pitchSVG(m){
  const W=300, H=470;
  let s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(t("tabTeams"))+'" style="display:block;width:100%;height:auto;border-radius:14px">';
  s += '<rect width="'+W+'" height="'+H+'" fill="#1E6A42"/>';
  for(let i=1;i<10;i+=2) s += '<rect x="0" y="'+(i*H/10)+'" width="'+W+'" height="'+(H/10)+'" fill="#246F47"/>';
  const ln = 'fill="none" stroke="rgba(255,255,255,.8)" stroke-width="2"';
  s += '<rect x="12" y="12" width="'+(W-24)+'" height="'+(H-24)+'" '+ln+'/><line x1="12" y1="'+H/2+'" x2="'+(W-12)+'" y2="'+H/2+'" '+ln+'/><circle cx="'+W/2+'" cy="'+H/2+'" r="38" '+ln+'/>';
  s += '<rect x="80" y="12" width="140" height="58" '+ln+'/><rect x="80" y="'+(H-70)+'" width="140" height="58" '+ln+'/><rect x="122" y="5" width="56" height="7" '+ln+'/><rect x="122" y="'+(H-12)+'" width="56" height="7" '+ln+'/>';
  const draw = (ids, top)=>{
    const ps = ids.map(id=>getP(m,id)).filter(Boolean);
    const gk = ps.find(isGK); const rest = ps.filter(p=>p!==gk);
    const by = {DEF:[], MID:[], FWD:[]};
    rest.forEach(p=> (by[p.pos]||by.MID).push(p));
    let rows = [];
    [by.DEF, by.MID, by.FWD].forEach(r=>{ if(!r.length) return; if(r.length<=4) rows.push(r); else { const h=Math.ceil(r.length/2); rows.push(r.slice(0,h), r.slice(h)); } });
    const color = top? "#E2F01C" : "#FF6A1A";
    const pts = [];
    if(gk) pts.push({p:gk, x:W/2, y:42});
    rows.forEach((r,ri)=>{ const y = rows.length===1? 140 : 92 + ri*(96/(rows.length-1)); r.forEach((p,j)=>pts.push({p, x:30+(W-60)*(j+1)/(r.length+1), y})); });
    pts.forEach(o=>{
      const y = top? o.y : H - o.y;
      const nm = o.p.name.length>10? o.p.name.slice(0,9)+"…" : o.p.name;
      s += '<circle cx="'+o.x+'" cy="'+y+'" r="12" fill="'+color+'" stroke="#13201A" stroke-width="2"/>';
      if(o.p.pos) s += '<text x="'+o.x+'" y="'+(y+4)+'" text-anchor="middle" font-size="'+(t("s"+o.p.pos).length>1?9:11)+'" font-weight="700" fill="#13201A" font-family="Barlow, sans-serif">'+esc(t("s"+o.p.pos))+'</text>';
      s += '<text x="'+o.x+'" y="'+(y+27)+'" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" stroke="#0F3B24" stroke-width="3" paint-order="stroke" font-family="Barlow, sans-serif">'+esc(nm)+'</text>';
    });
  };
  draw(m.teams.a, true); draw(m.teams.b, false);
  return s+'</svg>';
}
function viewTeams(){
  const m = currentMatch();
  if(!m) return '<div class="section empty"><p>'+esc(t("noMatch"))+'</p><button class="btn primary" data-a="newMatch">'+esc(t("createMatch"))+'</button></div>';
  let h = matchChips(m.id);
  const { playing } = lineup(m);
  if(playing.length<2) return h+'<div class="section empty"><p>'+esc(t("needPlayers"))+'</p><button class="btn" data-a="tab" data-v="match">'+esc(t("tabMatch"))+'</button></div>';

  const has = m.teams.a.length || m.teams.b.length || m.manualTeams;
  h += '<div class="section"><div class="row" style="margin-bottom:12px"><button class="btn primary grow" data-a="gen">'+esc(m.teams.a.length||m.teams.b.length? t("reshuffle"):t("buildTeams"))+'</button><button class="btn grow" data-a="manual">'+esc(t("manual"))+'</button>'+((m.teams.a.length||m.teams.b.length)?'<button class="btn grow" data-a="msg" data-k="teams">'+esc(t("shareTeams"))+'</button>':'')+'</div>';

  if(un.length){

      h += '<li class="prow" data-n="'+esc(norm(p.name))+'" data-p="'+esc(p.pos||"")+'"><div class="pmain"><div class="pname"><strong>'+esc(p.name)+'</strong><span class="meta"><span class="pips">'+pips(p.rating)+'</span>'+posBadge(p)+'</span></div>'+

    });

  }
  h += '<div class="section"><div class="pitch-wrap">'+pitchSVG(m)+'</div>';
  const col = (ids, cls, name)=>{
    let c = '<div class="team '+cls+'"><div class="team-head"><b>'+esc(name)+'</b><span>'+esc(t("teamMeta",{n:ids.length,s:teamSum(m,ids)}))+'</span><span>'+esc(posCounts(m,ids))+'</span></div>';
    ids.forEach(id=>{ const p=getP(m,id); c += '<div class="tprow"><button class="tp" data-a="move" data-id="'+id+'"><span class="nm">'+esc(p.name)+'</span><span class="sw">'+(p.pos? esc(t("s"+p.pos))+' ':'')+(p.rating||3)+'</span></button><button class="tx" data-a="unassign" data-id="'+id+'" aria-label="'+esc(t("remove"))+'">✕</button></div>'; });
    return c+'</div>';
  };
  h += '<div class="teams">'+col(m.teams.a,"a",t("teamA"))+col(m.teams.b,"b",t("teamB"))+'</div>';
  h += '<p class="diff">'+esc(t("strengthDiff"))+': '+Math.abs(teamSum(m,m.teams.a)-teamSum(m,m.teams.b))+'</p><p class="small muted" style="text-align:center;margin:4px 0 0">'+esc(t("tapToMove"))+'</p></div>';
  return h;
}

/* --- payments tab --- */
function viewPay(){
  const list = S.matches.filter(m=>m.status!=="cancelled").sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  if(!list.length) return '<div class="section empty"><p>'+esc(t("noPayMatch"))+'</p><button class="btn primary" data-a="newMatch">'+esc(t("createMatch"))+'</button></div>';
  let m = ui.payId && getMatch(ui.payId);
  if(!m || m.status==="cancelled"){ const cm=currentMatch(); m = cm || list[0]; }
  const payers = payersOf(m), sh = shareOf(m);

let toastT=null;

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); toast(t("copied")); return; }catch(e){}
  const ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast(t("copied")); }catch(e){}
  ta.remove();
}

/* ---------- actions ---------- */
function newMatch(){
  const all = S.matches.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const last = all.length? all[all.length-1].date : null;
  const y = new Date(); y.setDate(y.getDate()-1); const yesterday = iso(y);
  const ns = nextSlot(last && last>yesterday ? last : yesterday);
  const f = getField(S.settings.defaultFieldId);
  const m = { id:uid(), date:ns.date, time:ns.time, fieldId: f? f.id : "", price: (f && Number(f.price)) || Number(S.settings.price) || 0, format:S.settings.format, status:"open", att:{}, order:[], guests:[], paid:{}, exempt:{}, teams:{a:[],b:[]}, score:null };
  S.matches.push(m); ui.matchId = m.id; ui.payId = m.id;
  if(ui.tab!=="teams") ui.tab = "match";
  commit(); window.scrollTo(0,0);
}
function addPlayerNamed(name, rating, pos){
  name = String(name||"").trim().replace(/\s+/g," ");
  if(!name) return false;
  if(S.players.some(p=>p.name.toLocaleLowerCase("tr")===name.toLocaleLowerCase("tr"))) return null;
  S.players.push({ id:uid(), name, rating:rating||3, pos:pos||"", phone:"", active:true });
  return true;
}
function setAtt(m, id, s, force){
  if(!force && m.att[id]===s) delete m.att[id]; else m.att[id]=s;
  if(m.att[id]==="in"){ if(!m.order.includes(id)) m.order.push(id); }
  else m.order = m.order.filter(x=>x!==id);
}
function act(a, ds, el){
  if(ds.confirm && !el.classList.contains("armed")){
    const old = el.innerHTML; el.classList.add("armed"); el.textContent = t("sure");
    setTimeout(()=>{ if(el.isConnected){ el.classList.remove("armed"); el.innerHTML = old; } }, 3000);
    return;
  }
  const m = currentMatch();
  switch(a){
    case "tab": ui.tab = ds.v; ui.editId=null; render(); window.scrollTo(0,0); break;
    case "selMatch": ui.matchId = ds.id; ui.payId = ds.id; render(); break;
    case "newMatch": newMatch(); break;
    case "goTeams": ui.tab="teams"; render(); window.scrollTo(0,0); break;
    case "flt": ui.f[ds.k][ds.t] = ds.v; applyFilter(ds.k); break;
    case "clearQ": ui.f[ds.k].q = ""; { const i=document.getElementById("q-"+ds.k); if(i){ i.value=""; i.focus(); } } applyFilter(ds.k); break;
    case "att": {
      if(!m) return;
      setAtt(m, ds.id, ds.s, false);
      if(ui.f.att.q){ ui.f.att.q=""; ui.refocus="q-att"; }
      commit(); break;
    }
    case "addGuest": {
      if(!m) return; const n=$("#guestName").value.trim(); if(!n){ toast(t("needName")); return; }
      const g={ id:"g"+uid(), name:n, rating:Number($("#guestRate").value)||3, pos:$("#guestPos").value||"" };
      m.guests.push(g); setAtt(m, g.id, "in", true); commit(); break;
    }
    case "rmGuest": if(!m) return; m.guests=m.guests.filter(g=>g.id!==ds.id); delete m.att[ds.id]; m.order=m.order.filter(x=>x!==ds.id); delete m.paid[ds.id]; commit(); break;
    case "gen": if(!m) return; generateTeams(m); commit(); toast(t("teamsDone")); break;
    case "manual": if(!m) return; m.teams={a:[],b:[]}; m.manualTeams=true; ui.f.team={q:"",pos:""}; commit(); break;
    case "move": {
      if(!m) return; const id=ds.id;
      if(m.teams.a.includes(id)){ m.teams.a=m.teams.a.filter(x=>x!==id); m.teams.b.push(id); }
      else { m.teams.b=m.teams.b.filter(x=>x!==id); m.teams.a.push(id); }
      commit(); break;
    }
    case "unassign": if(!m) return; m.teams.a=m.teams.a.filter(x=>x!==ds.id); m.teams.b=m.teams.b.filter(x=>x!==ds.id); m.manualTeams=true; commit(); break;
    case "addTo": if(!m) return; m.teams[ds.team].push(ds.id); if(ui.f.team.q){ ui.f.team.q=""; ui.refocus="q-team"; } commit(); break;
    case "msg": {
      const mm = ds.id? getMatch(ds.id) : m; if(!mm) return;
      const text = ds.k==="invite"? msgInvite(mm) : ds.k==="teams"? msgTeams(mm) : msgPay(mm);
      openText(ds.k==="invite"? t("inviteMsg") : ds.k==="teams"? t("shareTeams") : t("payReminder"), text, true); break;
    }
    case "copy": { const ta=$("#mtext"); if(ta) copyText(ta.value); break; }
    case "copyIban": copyText(S.settings.iban); break;
    case "closeModal": closeModal(); break;
    case "finish": {
      if(!m) return; const a1=$("#scA").value, b1=$("#scB").value;
      m.score = (a1!==""||b1!=="")? { a:Number(a1)||0, b:Number(b1)||0 } : null;
      m.status="played"; ui.matchId=null; commit(); toast(t("matchDone")); break;
    }
    case "reopen": { const x=getMatch(ds.id); if(x){ x.status="open"; ui.matchId=x.id; ui.tab="match"; commit(); window.scrollTo(0,0); } break; }
    case "cancelMatch": if(!m) return; m.status="cancelled"; ui.matchId=null; commit(); break;
    case "delMatch": if(!m) return; S.matches=S.matches.filter(x=>x.id!==m.id); ui.matchId=null; commit(); break;
    case "paid": { const x=getMatch(ds.mid); if(!x) return; if(x.paid[ds.id]) delete x.paid[ds.id]; else x.paid[ds.id]=true; ui.payId=x.id; commit(); break; }
    case "exempt": { const x=getMatch(ds.mid); if(!x) return; if(x.exempt[ds.id]) delete x.exempt[ds.id]; else { x.exempt[ds.id]=true; delete x.paid[ds.id]; } ui.payId=x.id; commit(); break; }
    case "allPaid": { const x=getMatch(ds.id); if(!x) return; payersOf(x).forEach(id=>x.paid[id]=true); ui.payId=x.id; commit(); break; }
    case "settle": S.matches.forEach(x=>{ if(x.status!=="cancelled" && isDue(x) && payersOf(x).includes(ds.id)) x.paid[ds.id]=true; }); commit(); break;
    case "addPlayer": {
      const r = addPlayerNamed($("#newName").value, Number($("#newRate").value), $("#newPos").value);
      if(r===false){ toast(t("needName")); return; } if(r===null){ toast(t("exists")); return; }
      ui.refocus = "newName"; commit(); break;
    }
    case "bulkAdd": {
      const lines = $("#bulk").value.split(/\r?\n/).map(l=>l.replace(/^\s*\d+\s*[\.\)\-:]?\s*/,"").replace(/[^\p{L}\p{N}\s.'-]/gu,"").trim()).filter(Boolean);
      let n=0; lines.forEach(l=>{ if(addPlayerNamed(l,3,"")) n++; });
      commit(); toast(t("added",{n})); break;
    }
    case "editP": ui.editId = ui.editId===ds.id? null : ds.id; render(); break;
    case "rate": { const p=S.players.find(x=>x.id===ds.id); if(p){ p.rating=Number(ds.v); commit(); } break; }
    case "active": { const p=S.players.find(x=>x.id===ds.id); if(p){ p.active = p.active===false; commit(); } break; }
    case "delPlayer": S.players=S.players.filter(x=>x.id!==ds.id); ui.editId=null; commit(); break;
    case "tglSet": S.settings[ds.k]=!S.settings[ds.k]; commit(); break;
    case "newField": openFieldEditor(null, null); break;
    case "editField": openFieldEditor(ds.id, null); break;
    case "geo": {
      const out = $("#fe-coords");
      if(!navigator.geolocation){ toast(t("geoFail")); return; }
      if(out) out.textContent = t("locating");
      navigator.geolocation.getCurrentPosition(pos=>{
        const lat = Math.round(pos.coords.latitude*1e6)/1e6, lng = Math.round(pos.coords.longitude*1e6)/1e6;
        const a1=$("#fe-lat"), b1=$("#fe-lng"); if(a1) a1.value=lat; if(b1) b1.value=lng;
        if(out) out.textContent = lat+", "+lng; toast(t("locSaved"));
      }, ()=>{ if(out) out.textContent = t("locNone"); toast(t("geoFail")); }, { enableHighAccuracy:true, timeout:12000, maximumAge:60000 });
      break;
    }
    case "saveField": {
      const name = $("#fe-name").value.trim(); if(!name){ toast(t("fieldNeedName")); return; }
      const lat = $("#fe-lat").value, lng = $("#fe-lng").value;
      const data = { name, address:$("#fe-address").value.trim(), link:$("#fe-link").value.trim(), phone:$("#fe-phone").value.trim(), price:Number($("#fe-price").value)||0,
        lat: lat===""? null : Number(lat), lng: lng===""? null : Number(lng) };
      let f = getField(ds.id);
      if(f) Object.assign(f, data); else { f = Object.assign({ id:uid() }, data); S.fields.push(f); }
      if(!S.settings.defaultFieldId) S.settings.defaultFieldId = f.id;
      if(ui.fieldTarget==="match" && m){ m.fieldId=f.id; if(f.price) m.price=f.price; }
      if(ui.fieldTarget==="default") S.settings.defaultFieldId = f.id;
      ui.fieldTarget=null; closeModal(); commit(); toast(t("saved")); break;
    }
    case "delField": {
      const f = getField(ds.id); if(!f) return;
      S.matches.forEach(x=>{ if(x.fieldId===f.id){ x.field=f.name; x.fieldId=""; } });
      S.fields = S.fields.filter(x=>x.id!==f.id);
      if(S.settings.defaultFieldId===f.id) S.settings.defaultFieldId="";
      closeModal(); commit(); break;
    }
    case "export": openText(t("exportData"), JSON.stringify(S), true); break;
    case "importOpen": openText(t("importData"), "", false); break;
    case "doImport": {
      try{ const obj = JSON.parse($("#mtext").value); if(!obj || !Array.isArray(obj.players) || !Array.isArray(obj.matches)) throw 0;
        S = migrate(obj); closeModal(); commit(); toast(t("importOk")); }
      catch(e){ toast(t("importBad")); }
      break;
    }
    case "reset": { const lang=S.settings.lang; S=defaults(); S.settings.lang=lang; ui.matchId=null; ui.payId=null; commit(); break; }
  }
}
function onField(el){
  const f = el.dataset.f; const v = el.value;
  if(f==="payId"){ ui.payId=v; render(); return; }
  if(f==="s.defaultFieldId" || f==="m.fieldId"){
    if(v==="__new"){ openFieldEditor(null, f==="m.fieldId"?"match":"default"); render(); return; }
  }
  if(f.startsWith("s.")){
    const k=f.slice(2);
    S.settings[k] = (k==="price")? (Number(v)||0) : (k==="format")? Number(v) : v;
    commit(); toast(t("saved")); return;
  }
  if(f.startsWith("slot.")){
    const [,i,k]=f.split("."); S.settings.slots[i] = S.settings.slots[i]||{d:"",t:"21:00"};
    S.settings.slots[i][k] = k==="d"? (v===""? "" : Number(v)) : v; commit(); toast(t("saved")); return;
  }
  if(f.startsWith("m.")){
    const m=currentMatch(); if(!m) return; const k=f.slice(2);
    if(k==="date" && !v) return;
    if(k==="fieldId"){ m.fieldId=v; const fl=getField(v); if(fl && Number(fl.price)) m.price=Number(fl.price); if(v) delete m.field; }
    else m[k] = (k==="price")? (Number(v)||0) : (k==="format")? Number(v) : v;
    ui.matchId = m.id; commit(); return;
  }
  if(f.startsWith("p.")){
    const p=S.players.find(x=>x.id===el.dataset.id); if(!p) return; const k=f.slice(2);
    if(k==="name"){ const nv=v.trim().replace(/\s+/g," "); if(!nv){ el.value=p.name; return; } p.name=nv; }
    else p[k]=v;
    commit(); toast(t("saved")); return;
  }
}

document.addEventListener("click", e=>{
  const b = e.target.closest("[data-a]"); if(b){ act(b.dataset.a, b.dataset, b); return; }
  if(e.target.id==="modal") closeModal();
});
document.addEventListener("change", e=>{ if(e.target.dataset && e.target.dataset.f) onField(e.target); });
document.addEventListener("input", e=>{ const k = e.target.dataset && e.target.dataset.q; if(k){ ui.f[k].q = e.target.value; applyFilter(k); } });
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && !$("#modal").hidden) closeModal();
  if(e.key!=="Enter") return;
  const id = e.target.id;
  if(id==="newName"){ e.preventDefault(); act("addPlayer", {}, e.target); }
  else if(id==="guestName"){ e.preventDefault(); act("addGuest", {}, e.target); }
  else if(id==="q-att" || id==="q-team"){
    e.preventDefault();
    const key = id.slice(2), row = Array.from(document.querySelectorAll("#list-"+key+" [data-n]")).find(r=>!r.hidden);
    const m = currentMatch(); if(!row || !m) return;
    if(key==="att"){ const pid=row.dataset.id; setAtt(m, pid, "in", true); ui.f.att.q=""; ui.refocus="q-att"; commit(); }
    else { const btn=row.querySelector('[data-team="'+(m.teams.a.length<=m.teams.b.length?"a":"b")+'"]'); if(btn) act("addTo", btn.dataset, btn); }
  }
});

render();
initCloud();
})();
</script>
