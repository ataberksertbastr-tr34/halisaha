# Test, derleme ve yayın. Telefonda hiçbir şey kurulmaz; her şey burada çalışır.
#  - Her push ve pull request: tip kontrolü, birim testleri (Vitest),
#    derleme ve uçtan uca testler (Playwright, Chromium, 360 px).
#  - main'e merge edilince: aynı derleme GitHub Pages'e yayınlanır.
name: Test ve yayın

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ve derleme
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Tip kontrolü
        run: npm run typecheck

      - name: Birim testleri
        run: npm test

      - name: Derleme
        run: npm run build

      - name: Playwright tarayıcısı
        run: npx playwright install --with-deps chromium

      - name: Uçtan uca testler
        run: npm run e2e

      - name: Test raporu (hata olursa)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Pages paketi
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: GitHub Pages'e yayın
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
